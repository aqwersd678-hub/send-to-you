<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Miiu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="hint">phải mở thui</div>

  <div class="envelope" id="envelope">
    <div class="flap"></div>
    <div class="body"></div>
  </div>

  <img id="viewer" />

  <!-- HỘP CÂU HỎI -->
  <div id="questionBox" class="question-box">
    <div class="question-card">
      <img src="6.png" class="butterfly" />
      <p class="question-text">Tiểu thư có muốn từ chối không?</p>
      <div class="buttons">
        <button id="yesBtn">YESN'T</button>
        <button id="noBtn" disabled>NON'T</button>
      </div>
    </div>
  </div>

  <!-- LỜI KẾT -->
  <div id="finalBox" class="final-box">
    <img src="5.png" />
    <p>
      Ủa có tham gia hỏ hihi cảm ơn <b>CÔNG CHÚA</b> đã vui vẻ đồng ý tình cảm của <b>“tấm thân nhỏ bé”</b> nhé.<br>
      Mong sẽ thấy em với bộ đồ anh tặng và hộp quà anh trao 💗
    </p>
  </div>

  <script src="script.js"></script>
</body>
</html>
